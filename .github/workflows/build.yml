name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk photo-calendar.apk

      - uses: actions/upload-artifact@v4
        with:
          name: photo-calendar-apk
          path: photo-calendar.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 사진 달력 v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            휴대폰에서 아래 photo-calendar.apk를 눌러 받은 뒤 설치하세요.
            (처음 설치 시 '출처를 알 수 없는 앱' 설치 허용이 필요합니다)
          files: photo-calendar.apk
